@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  line-height: 1;
  color: var(--paper);
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* Team-perk badges, riding the squad-pip strip (the pip strip IS the life
   meter — see renderSquad). Each policy's pips form one .squad-pol block
   with that policy's badges beside them; the center-adjacent pips with
   badges flanking OUTSIDE come from renderSquad's fixed DOM order
   (group 0: icons,pips; group 1: pips,icons), never from side-reversal CSS
   — see the .squad-pol comment below for why mirroring was removed. Badges
   keep each perk's own fixed color (never team-tinted). */
.plate .perk-icos {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.plate .perk-ico { display: inline-flex; }
.plate .perk-ico svg {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  display: block;
}
/* Handicap chip: an amber pill next to the team name when that team is
   weakened. The full delta breakdown rides in the native `title` on hover
   (cursor:help hints it). Hidden entirely for an unhandicapped team. */
.plate .hcap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--ink);
  background: var(--amber);
  border-radius: calc(3 * var(--u));
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  flex: none;
  cursor: help;
  white-space: nowrap;
}
/* Squad strip: ONE pip per player (8). Each pip is a tiny pie: the filled
   wedge is that seat's remaining lives (full square = all lives, a sliver =
   last life), dim = down-but-respawning, hollow = eliminated. The strip is
   the "who's left" read; the big numeral is the exact lives count. Each pip
   is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(6 * var(--u));
  margin-top: calc(3 * var(--u));
}
.plate.side-r .squad { justify-content: flex-end; }
/* Policy groups keep the HEADLINE's left-to-right order on BOTH plates — the
   first-named policy's pips are always the left group, so a badge reads as
   belonging to the name it sits under. (No side mirroring: an early version
   reversed the strip on side-l for clock-symmetry, which visually attached
   the left badges to the wrong policy name.) */
.squad-pol {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  /* --fill (0..1) = lives left / max lives; wedge sweeps clockwise from 12 */
  background: conic-gradient(currentColor calc(var(--fill, 1) * 1turn), transparent 0);
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
/* faint frame so a part-filled pie still reads as one square slot */
.squad-pip::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) currentColor;
  opacity: 0.35;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.out::after { display: none; }       /* .out draws its own outline */
.squad-pip.carry {                                            /* has the flag */
  background: conic-gradient(var(--amber) calc(var(--fill, 1) * 1turn), transparent 0);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate .squad { color: var(--tc, var(--paper)); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier) /
   CAPTURED (GV32: retired, team eliminated — drawn like TAKEN). F2. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
  /* An outermost flag icon sits at the screen edge; an unclamped centered
     tag would poke past it (seen as stray clipped names at the band edges
     in 4-team games). */
  max-width: calc(58 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3 */
.plate.leader .lives-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #feed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* kill ticks are short and colored by the KILLER's team (a red tick = red
   scored a kill); team-kills and unattributable pileups stay neutral. */
.beat-marker.kill { background: var(--tc, var(--paper-dim)); height: calc(6 * var(--u)); }
/* flag beats are colored by the FLAG's team, matching the banners ("RED
   HEART TAKEN"): steal = full tick with a flag head, return = same tick
   dimmed (the heart snapped home), capture = the chunky match point in the
   CAPTURING team's color. */
.beat-marker.steal { background: var(--tc, var(--amber)); }
.beat-marker.steal::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: calc(5 * var(--u));
  height: calc(3 * var(--u));
  background: inherit;
}
.beat-marker.return { background: var(--tc, var(--paper-dim)); opacity: 0.45; }
.beat-marker.capture { background: var(--tc, var(--amber)); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* a 4-team match can retire several rival hearts (GV32: a capture eliminates
   its team and play continues), so the Cap cell lays its hearts in a row,
   later hearts shingling over earlier ones so three still fit the column */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }

}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }

/* ============================================================
   cooperative-hunting additions to the inherited coworld-ctf chrome.
   Everything above this block is the starter's CSS, kept verbatim except
   for the rules belonging to the elements the design note removes (#fpv,
   #lockerroom, #killfeed, #povBadge, #mmwarn and the whole #viewpanel zoom
   bar + minimap). Everything below is this game's: the six hunter plates,
   the round clock, the feed, the scrubber beats and the grass toggle.
   ============================================================ */

#feed {
  position: absolute;
  right: calc(8 * var(--u));
  bottom: calc(var(--band, 0px) + 6 * var(--u));
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: calc(2 * var(--u));
  pointer-events: none;
  max-width: min(64%, calc(320 * var(--u)));
}
#feed .feed-row { pointer-events: none; }
#feed .feed-row.say { color: var(--paper); font-style: italic; }
#feed .feed-row.hurt { color: var(--red); }
#feed .feed-row.tag { color: var(--amber); }
#feed .feed-row.round { color: var(--paper-dim); letter-spacing: calc(1 * var(--u)); }
#feed .feed-row.fallback { color: var(--ghost); }

/* Six hunter plates in slot order, three each side of the clock. The
   starter stacks its two team plates in a column; six hunters would make
   that band 400 px tall and swallow the board, so ours run in a row and
   wrap only when the frame is too narrow to hold three. */
#scorebug .plates { flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: calc(4 * var(--u)); padding: 0 calc(3 * var(--u)); overflow: hidden; }

/* Six hunter plates in slot order: colour chip, alias, the REAL policy
   name, score in big digits, an energy bar 0-200 and a role/level badge. */
.hplate {
  display: flex;
  align-items: center;
  gap: calc(4 * var(--u));
  background: var(--ink-soft);
  padding: calc(2 * var(--u)) calc(5 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  line-height: 1.1;
  min-width: 0;
  flex: 1 1 0;
}
.hplate.dc { opacity: .42; filter: grayscale(1); }
.hplate .chip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  flex: 0 0 auto;
  border-radius: 50%;
}
.plate-alias { color: var(--paper-dim); flex: 0 0 auto; }
/* Player names must never collapse to an ellipsis in the ~360 px featured
   match iframe: give the name the flex growth and a floor of its own. */
.plate-name { flex: 1 1 auto; min-width: 3.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate-score {
  font-weight: 700;
  font-size: calc(13 * var(--u));
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
  margin-left: auto;
  color: var(--paper);
}
.plate-energy {
  position: relative;
  height: calc(5 * var(--u));
  width: calc(34 * var(--u));
  flex: 0 0 auto;
  background: #2a1a12;
  border: calc(1 * var(--u)) solid #4a2e21;
}
.plate-energy i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--green); }
.plate-badge {
  flex: 0 0 auto;
  font-size: calc(7.5 * var(--u));
  letter-spacing: calc(0.6 * var(--u));
  color: var(--amber);
  border: calc(1 * var(--u)) solid currentColor;
  padding: 0 calc(3 * var(--u));
}

#gamechips {
  position: absolute;
  left: calc(8 * var(--u));
  bottom: calc(var(--band, 0px) + 6 * var(--u));
  z-index: 7;
  display: flex;
  gap: calc(4 * var(--u));
}
#gamechips button {
  font-family: var(--pixfont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: calc(0.6 * var(--u));
  color: var(--paper-dim);
  background: var(--ink-soft);
  border: calc(1 * var(--u)) solid #4a2e21;
  padding: calc(2 * var(--u)) calc(6 * var(--u));
  cursor: pointer;
}
#gamechips button.on { color: var(--amber); border-color: var(--amber); }
#gamechips[hidden] { display: none; }

/* Scrubber beats: clickable, LABELLED buttons that seek to their tick. Every
   kind the game emits has a rule here and no other kind is ever emitted --
   round, bigcatch, smallcatch, tag, end. */
.beat-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: calc(3 * var(--u));
  margin-left: calc(-1.5 * var(--u));
  padding: 0;
  border: 0;
  background: var(--paper-dim);
  cursor: pointer;
  z-index: 4;
  overflow: hidden;
  text-indent: -999em;
}
.beat-marker:hover, .beat-marker:focus-visible { outline: calc(1 * var(--u)) solid var(--paper); }
.beat-marker.round { background: var(--paper-dim); }
.beat-marker.bigcatch { background: var(--amber); width: calc(4 * var(--u)); }
.beat-marker.smallcatch { background: var(--green); }
.beat-marker.tag { background: var(--red); }
.beat-marker.end { background: var(--paper); width: calc(4 * var(--u)); }
.beat-marker.ahead { opacity: .28; }

/* The endcard stops ABOVE the transport band and every seek dismisses it. */
#endcard { bottom: var(--band, 0px); }
#ec-standings { margin-top: calc(6 * var(--u)); width: min(96%, calc(460 * var(--u))); }
#ec-standings .row {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  padding: calc(2 * var(--u)) 0;
  border-bottom: calc(1 * var(--u)) solid #3a2a1e;
}
#ec-standings .row .rank { color: var(--paper-dim); flex: 0 0 calc(16 * var(--u)); }
#ec-standings .row .score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }

@media (max-width: 640px) {
  /* At the ~360 px featured-match width the scorebug, the clock and the feed
     are what must stay legible, so everything decorative gives way first. */
  #speedchips .chip-label, .tbtn .label { display: none !important; }
  /* The scorebug's local --u is what every measure in the band derives from
     (the starter's own knob), so ONE px floor keeps six plates legible in
     the ~360 px featured-match iframe instead of shrinking to 3.6 px type. */
  #scorebug {
    --u: max(0.95px, calc(1px * var(--hudscale) * 0.8));
    /* Restack: the clock on its own row, then all six plates across the full
       width. The starter's three-track grid leaves each side ~110 px at this
       size, which is where a policy name collapses to an ellipsis. */
    grid-template-columns: 1fr;
    gap: calc(3 * var(--u));
    padding: calc(4 * var(--u)) calc(6 * var(--u));
  }
  #scorebug .clock-col { order: -1; }
  #scorebug .plates { gap: calc(3 * var(--u)); }
  #clock-time { font-size: calc(15 * var(--u)); }
  /* The colour chip already identifies the seat, so the alias is the label
     that gives way and the REAL policy name keeps the room. */
  .plate-alias { display: none; }
  .hplate { min-width: 0; flex: 1 1 30%; padding: calc(1 * var(--u)) calc(3 * var(--u)); }
  .hplate .plate-energy { display: none; }
  .hplate .plate-badge { display: none; }
  #feed { max-width: 72%; font-size: calc(7.5 * var(--u)); }
  #ec-headline { font-size: clamp(13px, 4.2vw, 26px); }
}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <div id="chrome">
    <!-- Six hunter plates in slot order, three each side of the clock:
         colour chip, Cog- alias, the real policy name, score, an energy
         bar 0-200 and a role/level badge. Built by buildPlates(). -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">ROUND 1 OF 3</div>
          <span class="ffwd-mini" id="ffwd-mini">&#9656;&#9656;</span>
          <div class="caption" id="clock-caption">Waiting for the hunt</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <!-- One line per catch, plan `say`, trample, gore, tag, forage and
         fallback. #feed replaces the starter's #killfeed. -->
    <div id="feed"></div>
    <!-- predator-prey only: fade tall grass to 40 % alpha so the
         spectator sees the ambush the hunter could not. -->
    <div id="gamechips" hidden>
      <button type="button" id="btn-grass">grass</button>
    </div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: kills / flag story / winner on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">HUNT</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div id="ec-standings"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // The two splice markers above are replaced with <script src> tags by
  // Dockerfile.replay-viewer when the static bundle is built. A raw open of
  // this source file has no splice, so pull the same files in by src and
  // re-enter once they are up. Inherited from the starter.
  function need(name, global) {
    return typeof window[global] === 'undefined' ? name : null;
  }
  var missing = [
    need('chrome_common.js', 'ChromeCommon'),
    need('static_replay.js', 'CooperativeHuntingStaticReplay')
  ].filter(Boolean);
  if (missing.length) {
    var base = location.pathname.indexOf('/client/') === 0 ? '/client/' : './';
    var pending = missing.length;
    missing.forEach(function (file) {
      var tag = document.createElement('script');
      tag.src = base + file;
      tag.onload = function () { if (--pending === 0) boot(); };
      tag.onerror = function () { pending = -1; };
      document.head.appendChild(tag);
    });
    return;
  }
  boot();

  /* ==========================================================
     cooperative-hunting additions to the inherited coworld-ctf chrome.
     Everything above this comment is the starter's boot scaffolding; this
     block is the game half: it reads the chrome label off sprite 4090 (via
     BroadcastCore's onText, which the worker forwards) and drives the six
     hunter plates, the round clock, the feed, the scrubber beats, the
     endcard and the grass toggle.

     No function declared here may share a name with a ChromeCommon alias
     (markBeat, esc, fmt, renderClock, ...): a hoisted `function markBeat`
     shadows the alias and the beats render as unlabeled dead divs (tandem,
     2026-08-23). Ours is pushHuntBeat.
     ========================================================== */
  function boot() {
    var byId = function (id) { return document.getElementById(id); };
    var SPEEDS = [1, 2, 4, 8];
    var core = null;
    var chrome = null;
    var beatsBuilt = false;
    var beatEls = [];
    var feedLines = [];
    var platesBuilt = 0;
    var tickCount = 1;
    var currentIndex = 0;
    var loop = false;
    var endShown = false;
    var grassOpen = false;

    function escText(value) { return String(value == null ? '' : value); }

    function fmtRound(state) {
      return 'ROUND ' + state.round + ' OF ' + state.rounds;
    }

    // ---- scorebug --------------------------------------------------------
    function buildPlates(seats) {
      var left = byId('plates-l');
      var right = byId('plates-r');
      left.textContent = '';
      right.textContent = '';
      var half = Math.ceil(seats.length / 2);
      seats.forEach(function (seat, index) {
        var plate = document.createElement('div');
        plate.className = 'hplate';
        plate.id = 'hplate-' + seat.slot;
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.style.background = COG_COLORS[seat.color % COG_COLORS.length];
        plate.appendChild(chip);
        var alias = document.createElement('span');
        alias.className = 'plate-alias';
        alias.textContent = escText(seat.alias);
        plate.appendChild(alias);
        var name = document.createElement('span');
        name.className = 'plate-name';
        // Real policy names live HERE and in the endcard, and nowhere else:
        // in-game every hunter is only a coloured sprite and a Cog- alias.
        name.textContent = escText(seat.name);
        plate.appendChild(name);
        var energy = document.createElement('span');
        energy.className = 'plate-energy';
        energy.innerHTML = '<i></i>';
        plate.appendChild(energy);
        var badge = document.createElement('span');
        badge.className = 'plate-badge';
        plate.appendChild(badge);
        var score = document.createElement('span');
        score.className = 'plate-score';
        score.textContent = '0';
        plate.appendChild(score);
        (index < half ? left : right).appendChild(plate);
      });
      platesBuilt = seats.length;
    }

    var COG_COLORS = [
      '#ff004d', '#29adff', '#ffa300', '#ff77a8', '#ffec27', '#00e436',
      '#8376c8', '#fff1e8', '#008751', '#ab5236', '#1d2b53', '#7e2553',
      '#00c8c8', '#c2c3c7', '#ff6464', '#b4e650', '#dc96ff', '#ffc878',
      '#64dcaa', '#ff50b4'
    ];

    function updatePlates(state) {
      state.seats.forEach(function (seat) {
        var plate = byId('hplate-' + seat.slot);
        if (!plate) return;
        plate.classList.toggle('dc', !!seat.dc);
        var bar = plate.querySelector('.plate-energy i');
        if (bar) bar.style.width = Math.max(0, Math.min(100, seat.energy / 2)) + '%';
        var score = plate.querySelector('.plate-score');
        if (score) score.textContent = String(seat.score);
        var badge = plate.querySelector('.plate-badge');
        if (badge) {
          if (state.variant === 'lbf') {
            badge.textContent = 'L' + seat.level;
            badge.hidden = false;
          } else if (state.variant === 'predator-prey') {
            badge.textContent = seat.role === 'forager' ? 'FORAGE' : 'HUNT';
            badge.hidden = false;
          } else {
            badge.textContent = '';
            badge.hidden = true;
          }
        }
      });
    }

    // ---- clock -----------------------------------------------------------
    function updateClock(state) {
      // Real numbers, never internal notation: the round out of the round
      // count, and the play tick out of the episode's play ticks.
      var playTick = (state.round - 1) * state.ticksPerRound +
        (state.rtick || 0);
      var playTotal = state.rounds * state.ticksPerRound;
      byId('clock-time').textContent = fmtRound(state);
      byId('clock-caption').textContent =
        (state.phase === 'card'
          ? 'Round card'
          : (VARIANT_CAPTION[state.variant] || 'The hunt')) +
        ' \u00b7 ' + playTick + ' / ' + playTotal;
      byId('tick-clock').textContent = playTick + ' / ' + playTotal;
    }

    var VARIANT_CAPTION = {
      'staghunt': 'Stag hunt',
      'coop-mining': 'Cooperative mining',
      'lbf': 'Level-based foraging',
      'predator-prey': 'Predator and prey'
    };

    // ---- feed ------------------------------------------------------------
    function pumpFeed(state) {
      if (!state.feed || !state.feed.length) return;
      state.feed.forEach(function (line) {
        feedLines.push(line);
      });
      while (feedLines.length > 6) feedLines.shift();
      var host = byId('feed');
      host.textContent = '';
      feedLines.forEach(function (line) {
        var row = document.createElement('div');
        row.className = 'feed-row ' + (line.kind || '');
        row.textContent = escText(line.text);
        host.appendChild(row);
      });
    }

    // ---- scrubber beats --------------------------------------------------
    var BEAT_LABEL = {
      round: 'Round boundary',
      bigcatch: 'Big animal taken',
      smallcatch: 'Small catch',
      tag: 'Forager tagged',
      end: 'Hunt over'
    };

    function pushHuntBeat(tick, kind) {
      // NOT markBeat: that name is a ChromeCommon alias and a hoisted
      // declaration here would shadow it (tandem, 2026-08-23).
      var label = BEAT_LABEL[kind];
      if (!label) return;
      var mark = document.createElement('button');
      mark.type = 'button';
      mark.className = 'beat-marker ' + kind;
      mark.style.left = (100 * tick / Math.max(1, tickCount)) + '%';
      mark.title = label + ' at tick ' + tick;
      mark.textContent = label;
      mark.setAttribute('aria-label', label + ' at tick ' + tick + ' (seek)');
      mark.onclick = function (event) {
        event.stopPropagation();
        seekTo(Math.round(tick * (tickCount - 1) / Math.max(1, tickCount)));
      };
      byId('scrub').appendChild(mark);
      beatEls.push({ tick: tick, el: mark });
    }

    function buildBeats(state) {
      if (beatsBuilt || !state.beats || !state.beats.length) return;
      beatsBuilt = true;
      state.beats.forEach(function (beat) { pushHuntBeat(beat.t, beat.k); });
    }

    function gateBeats(state) {
      var spoil = byId('btn-spoilers').classList.contains('on');
      beatEls.forEach(function (entry) {
        entry.el.classList.toggle('ahead', !spoil && entry.tick > state.tick);
      });
    }

    // ---- endcard ---------------------------------------------------------
    function showEndcard(final) {
      if (endShown || !final) return;
      endShown = true;
      byId('ec-headline').textContent = final.reason === 'complete'
        ? 'HUNT OVER'
        : 'HUNT OVER \u2014 ' + String(final.reason).toUpperCase();
      byId('ec-wincond').textContent = 'Score is every capture you stood a ' +
        'side for. Higher is better.';
      byId('ec-how').textContent = '';
      var host = byId('ec-standings');
      host.textContent = '';
      (final.order || []).forEach(function (entry, index) {
        var row = document.createElement('div');
        row.className = 'row';
        var rank = document.createElement('span');
        rank.className = 'rank';
        rank.textContent = '#' + (index + 1);
        row.appendChild(rank);
        var alias = document.createElement('span');
        alias.className = 'plate-alias';
        alias.textContent = escText(entry.alias);
        row.appendChild(alias);
        var name = document.createElement('span');
        name.className = 'plate-name';
        name.textContent = escText(entry.name);
        row.appendChild(name);
        var score = document.createElement('span');
        score.className = 'score';
        score.textContent = String(entry.score);
        row.appendChild(score);
        host.appendChild(row);
      });
      byId('endcard').classList.add('on');
      byId('win-chip').textContent = String(final.reason).toUpperCase();
    }

    function hideEndcard() {
      endShown = false;
      byId('endcard').classList.remove('on');
    }

    // ---- transport -------------------------------------------------------
    function seekTo(index) {
      // Every seek dismisses the endcard so the match is visible again; it
      // comes back when playback reaches the end once more.
      hideEndcard();
      currentIndex = Math.max(0, Math.min(tickCount - 1, index));
      core.seek(currentIndex);
    }

    function buildSpeedChips() {
      var host = byId('speedchips');
      host.textContent = '';
      SPEEDS.forEach(function (value) {
        var chip = document.createElement('button');
        chip.className = 'chip' + (value === 1 ? ' on' : '');
        chip.textContent = value + '\u00d7';
        chip.onclick = function () {
          core.setSpeed(value);
          Array.prototype.forEach.call(host.children, function (node) {
            node.classList.remove('on');
          });
          chip.classList.add('on');
        };
        host.appendChild(chip);
      });
    }

    function wireTransport() {
      byId('btn-play').onclick = function () {
        core.setPlaying(!core.isPlaying());
        byId('btn-play').textContent = core.isPlaying() ? '\u25b6' : '\u275a\u275a';
      };
      byId('btn-restart').onclick = function () { seekTo(0); };
      byId('btn-back').onclick = function () { seekTo(currentIndex - 1); };
      byId('btn-fwd').onclick = function () { seekTo(currentIndex + 40); };
      byId('btn-end').onclick = function () { seekTo(tickCount - 1); };
      byId('btn-loop').onclick = function () {
        loop = !loop;
        byId('btn-loop').classList.toggle('on', loop);
      };
      byId('btn-skip').onclick = function () {
        var on = !byId('btn-skip').classList.contains('on');
        byId('btn-skip').classList.toggle('on', on);
        byId('ffwd-chip').classList.toggle('show', on);
        core.setSpeed(on ? 4 : 1);
      };
      byId('btn-spoilers').onclick = function () {
        byId('btn-spoilers').classList.toggle('on');
        if (chrome) gateBeats(chrome);
      };
      byId('scrub').onclick = function (event) {
        // Beat markers stopPropagation, so anything that reaches here is a
        // seek on the track itself.
        var rect = byId('scrub').getBoundingClientRect();
        var ratio = (event.clientX - rect.left) / Math.max(1, rect.width);
        seekTo(Math.round(ratio * (tickCount - 1)));
      };
      byId('btn-grass').onclick = function () {
        grassOpen = !grassOpen;
        byId('btn-grass').classList.toggle('on', grassOpen);
        core.sendCommand('g');
      };
      window.addEventListener('keydown', function (event) {
        if (event.key === ' ') { byId('btn-play').onclick(); event.preventDefault(); }
        else if (event.key === 'e') seekTo(tickCount - 1);
        else if (event.key === ',') seekTo(0);
        else if (event.key === 'b') byId('btn-back').onclick();
        else if (event.key === '.') byId('btn-fwd').onclick();
        else if (event.key === 'r') byId('btn-loop').onclick();
        else if (event.key === 'f') byId('btn-skip').onclick();
        else if (event.key === 'o') byId('btn-spoilers').onclick();
      });
    }

    // ---- the chrome channel ---------------------------------------------
    function onChromeText(text) {
      var state;
      try { state = JSON.parse(text); } catch (error) { return; }
      if (!state || typeof state.tick !== 'number') return;
      chrome = state;
      if (state.seats && state.seats.length &&
          platesBuilt !== state.seats.length) {
        buildPlates(state.seats);
      }
      buildBeats(state);
      updateClock(state);
      updatePlates(state);
      pumpFeed(state);
      gateBeats(state);
      byId('gamechips').hidden = state.variant !== 'predator-prey';
      var progress = tickCount > 1 ? currentIndex / (tickCount - 1) : 0;
      byId('scrub-fill').style.width = (progress * 100) + '%';
      byId('scrub-head').style.left = (progress * 100) + '%';
      byId('status').textContent = '';
      if (state.final) showEndcard(state.final);
    }

    // ---- boot ------------------------------------------------------------
    core = window.CooperativeHuntingStaticReplay.createCore({
      canvas: byId('board'),
      onText: onChromeText,
      onStatus: function (status) { byId('status').textContent = status; },
      onFirstFrame: function () { core.setViewportFit(); },
      onLoaded: function (count) {
        tickCount = count || 1;
        core.setViewportFit();
      },
      onTick: function (index, count) {
        currentIndex = index;
        tickCount = count || tickCount;
      },
      onEnd: function () {
        if (loop) { seekTo(0); feedLines = []; return; }
        if (chrome && chrome.final) showEndcard(chrome.final);
      }
    });
    buildSpeedChips();
    wireTransport();
    window.addEventListener('resize', function () { core.setViewportFit(); });
    core.start();

    // --hudscale / --band relayout loop, inherited from the starter. The
    // game block READS --band and never writes it.
    var lastBoardBox = '';
    function relayout() {
      var stage = byId('stage');
      var root = document.documentElement;
      var width = stage.clientWidth || 760;
      root.style.setProperty('--hudscale',
        String(Math.max(0.5, Math.min(1.6, width / 760))));
      stage.classList.toggle('tiny', width <= 620);
      var transport = byId('transport');
      if (transport) root.style.setProperty('--band', transport.offsetHeight + 'px');
      // --topband is the starter's other reserved band: the scorebug strip
      // above the board. #board and #endcard both size against it, so a
      // six-plate scorebug that is taller than ctf's two-plate one must
      // report its real height or it covers play.
      var scorebug = byId('scorebug');
      if (scorebug) root.style.setProperty('--topband', scorebug.offsetHeight + 'px');
      var board = byId('board');
      var boxKey = board.clientWidth + 'x' + board.clientHeight;
      if (boxKey !== lastBoardBox) {
        lastBoardBox = boxKey;
        if (core) core.setViewportFit();
      }
      requestAnimationFrame(relayout);
    }
    relayout();
  }
})();
</script>
</body>
</html>
